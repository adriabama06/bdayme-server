name: bdayme

services:
  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:${PORT:-6570}/healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_started

  nginx:
    restart: unless-stopped
    image: nginx:1.29.0-alpine
    ports:
      - 6570:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  db:
    restart: unless-stopped
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: bdayme
      POSTGRES_PASSWORD: bdaymepass
      POSTGRES_DB: bdayme
      POSTGRES_HOST_AUTH_METHOD: trust
    # ports:
    #   - "5432:5432"
    volumes:
      - postgre:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdayme -d bdayme"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:9.11
    environment:
      PGADMIN_DEFAULT_EMAIL: bdayme@mail.com
      PGADMIN_DEFAULT_PASSWORD: bdaymepass
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5433:5050"
    volumes:
      - pgadmin:/data
    depends_on:
      - db

  redis:
    restart: unless-stopped
    image: redis:7.4.1-alpine3.20
    # ports:
    #   - "6379:6379"
    environment:
      - REDIS_REPLICATION_MODE=master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-insight:
    restart: unless-stopped
    image: redis/redisinsight:3.0
    ports:
      - "6380:5540"
    volumes:
      - redis-insight:/data
    depends_on:
      - redis

volumes:
  postgre:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgre
  pgadmin:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./pgadmin
  redis-insight:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./redis-insight

networks:
  default:
    name: bdayme-network