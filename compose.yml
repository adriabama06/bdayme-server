name: bdayme

services:
  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    # Wait for db and redis to start  
    entrypoint: sh -c "sleep 10 && node ."
    # ports:
    #   - 6570:80
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:${PORT:-6570}/healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - db
      - redis
      - nginx

  nginx:
    restart: unless-stopped
    image: nginx:1.29.0-alpine
    ports:
      - 6570:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  db:
    restart: unless-stopped
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: bdayme
      POSTGRES_PASSWORD: bdaymepass
      POSTGRES_DB: bdayme
      POSTGRES_HOST_AUTH_METHOD: trust
    # ports:
    #   - "5432:5432"
    volumes:
      - postgre:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    restart: unless-stopped
    image: redis:7.4.1-alpine3.20
    # ports:
    #   - "6379:6379"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  postgre:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgre

networks:
  default:
    name: bdayme-network