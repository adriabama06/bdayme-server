name: bdayme

services:
  bdayme:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 6570:80
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:${PORT:-80}/healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: bdayme
      POSTGRES_PASSWORD: bdaymepass
      POSTGRES_DB: bdayme
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - postgres_initsql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7.4.1-alpine3.20
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgres
  postgres_initsql:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./init.sql

networks:
  default:
    name: bdayme-network