name: bdayme

services:
  server:
    restart: unless-stopped
    image: bdayme-server
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    # Time Docker waits after SIGTERM before SIGKILL. Must be higher than
    # SHUTDOWN_TIMEOUT_MS (src/index.js, default 30s) so in-flight requests
    # can finish on scale-down / redeploy.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:${PORT:-6570}/healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations run exactly once (one-shot service) BEFORE any replica starts,
      # so no two replicas race the same ALTER TABLE on boot.
      dbmigrate:
        condition: service_completed_successfully
    labels:
      # Traefik load-balances every `server` replica round-robin (same labels
      # on all replicas merge into one Traefik service).
      - traefik.enable=true
      - traefik.http.routers.bdayme.rule=PathPrefix(`/api/v0/`)
      - traefik.http.routers.bdayme.entrypoints=web
      - traefik.http.routers.bdayme.middlewares=bdayme-strip
      # Same as the old nginx `location /api/v0/ { proxy_pass http://server:6570/; }`
      - traefik.http.middlewares.bdayme-strip.stripprefix.prefixes=/api/v0
      - traefik.http.services.bdayme.loadbalancer.server.port=${PORT:-6570}

  traefik:
    restart: unless-stopped
    image: traefik:v3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=bdayme-network
      - --entryPoints.web.address=:80
      - --log.level=INFO
      - "--log.format=common"
      - "--accesslog=true"
      - "--accesslog.format=common"
    ports:
      - 6570:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No depends_on needed: the Docker provider picks the replicas up dynamically

  # One-shot database migration job. Runs automatically before the server
  # replicas (see depends_on above) and can also be run manually:
  #   docker compose run --rm dbmigrate
  #   docker compose run --rm dbmigrate node scripts/check_database_update.js --check
  dbmigrate:
    restart: "no"
    # Same image as `server` (built once, shared)
    image: bdayme-server
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run db:update
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: unless-stopped
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: bdayme
      POSTGRES_PASSWORD: bdaymepass
      POSTGRES_DB: bdayme
      POSTGRES_HOST_AUTH_METHOD: trust
    # ports:
    #   - "5432:5432"
    volumes:
      - postgre:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdayme -d bdayme"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:9.11
    environment:
      PGADMIN_DEFAULT_EMAIL: bdayme@mail.com
      PGADMIN_DEFAULT_PASSWORD: bdaymepass
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5433:5050"
    volumes:
      - pgadmin:/data
    depends_on:
      - db

  redis:
    restart: unless-stopped
    image: redis:7.4.1-alpine3.20
    # ports:
    #   - "6379:6379"
    environment:
      - REDIS_REPLICATION_MODE=master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-insight:
    restart: unless-stopped
    image: redis/redisinsight:3.0
    ports:
      - "6380:5540"
    volumes:
      - redis-insight:/data
    depends_on:
      - redis

volumes:
  postgre:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgre
  pgadmin:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./pgadmin
  redis-insight:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./redis-insight

networks:
  default:
    name: bdayme-network
